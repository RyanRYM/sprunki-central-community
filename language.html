<!DOCTYPE html><html lang="en" dir="ltr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Choose your language | SCC</title><link rel="stylesheet" href="assets/css/style.css"></head><body class="language-page"><main class="language-shell"><div class="language-card"><div class="language-logo"><img src="assets/images/scc-symbol.png" alt="SCC"></div><p class="eyebrow">SPRUNKI CENTRAL COMMUNITY</p><h1>Choose your language:</h1><div class="language-actions"><button class="btn primary" data-lang="en">English</button><button class="btn secondary" data-lang="fa">فارسی</button></div></div><p class="language-choice-note">Select a language to continue.</p></main><script>function setLang(v){try{localStorage.setItem('scc_language_v100',v)}catch{}try{sessionStorage.setItem('scc_language_v100',v)}catch{}try{document.cookie='scc_language_v100='+v+'; Max-Age=31536000; Path=/; SameSite=Lax'}catch{};location.replace('index.html?lang='+v)}document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.lang)));</script><script src="assets/js/site-ui.js?v=100"></script></body></html>
